<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            transition: background-color 0.5s ease;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        #quote { 
            font-size: 20px; 
            color: #2980b9; 
            margin: 20px 0; 
            min-height: 50px;
            font-weight: bold;
        }
        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #c0392b; transform: scale(1.05); }
        footer { margin-top: 20px; color: #777; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Interactive Web Project</h1>
        <p id="quote">Click the button to change the color & get a quote!</p>
        <button onclick="changeTheme()">Change Color & Quote</button>
        <footer>Hosted for free on GitHub Pages</footer>
    </div>

    <script>
        // Motivational quotes
        const quotes = [
            "Success starts with a single step 🚀",
            "Keep learning and never give up 📚",
            "Every expert was once a beginner ",
            "Persistence makes miracles happen ✨",
            "Today is a new chance to grow 🌟",
            "Coding is creativity in action 🎨"
        ];

        // Soft background colors
        const colors = ["#e8f5e9", "#fff3e0", "#e3f2fd", "#fce4ec", "#f3e5f5", "#e0f7fa"];

        function changeTheme() {
            // Random background color
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;

            // Random quote
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById("quote").innerHTML = randomQuote;
        }
    </script>
</body>
</html>
