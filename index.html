<!DOCTYPE html>
<html>
<head>
    <title>My Mini Project</title>
    <style>
        body {
            background-color: #ADD8E6;
            text-align: center;
            font-family: Arial, sans-serif;
            padding-top: 100px;
        }
        
        h1 {
            color: green;
        }
        
        p.subtitle {
            color: black;
            font-size: 18px;
        }
        
        .btn {
            background-color: red;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }
        
        #message {
            margin-top: 15px;
            font-size: 18px;
            color: blue;
        }
    </style>
</head>
<body>
    <h1>Welcome Students</h1>
    <p class="subtitle">HTML.CSS JavaScript Practice</p>
    <button class="btn" onclick="showMessage()">Click Here</button>
    <p id="message"></p>
    
    <script>
        function showMessage() {
            document.getElementById("message").innerHTML = "Keep Learning and Shine Bright!";
        }
    </script>
</body>
</html>
